[project]
name = "zenith-registrar"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "configomatic[yaml]>=0.4.0",
    "cryptography>=50.0.1",
    "easykube>=0.6.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic<3",
    "uvicorn>=0.52.4",
]

[project.scripts]
consul = "zenith.registrar.backends.consul:Backend"
crd    = "zenith.registrar.backends.crd:Backend"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1+unknown"

[tool.hatch.build.targets.sdist]
packages = ["registrar"]
[tool.hatch.build.targets.wheel]
packages = ["registrar"]
