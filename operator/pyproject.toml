[project]
name = "zenith-operator"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "configomatic[yaml]>=0.4.0",
    "cryptography>=50.0.1",
    "easykube>=0.6.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "kopf>=1.44.6",
    "kube-custom-resource>=0.6.1",
    "pydantic<3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1+unknown"

[tool.hatch.build.targets.sdist]
packages = ["zenith"]
[tool.hatch.build.targets.wheel]
packages = ["zenith"]
