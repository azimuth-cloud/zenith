name: Tox unit tests

on:
  push:
  workflow_call:
    inputs:
      ref:
        type: string
        description: The ref to build.
        required: true

jobs:
  tox-test:
    name: Tox in ${{ matrix.subdir }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        subdir: ['client', 'operator', 'registrar', 'sshd', 'sync']
        python-version: ['3.12']

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Sync from the workspace root so the root dev group (tox, tox-uv) is installed
      - name: Install workspace dependencies
        run: uv sync --locked

      - name: Run tox in ${{ matrix.subdir }}
        working-directory: ${{ matrix.subdir }}
        run: uv run tox

      - name: Generate coverage report (optional)
        working-directory: ${{ matrix.subdir }}
        run: uv run tox -e cover || echo "No cover env, skipping"

      - name: Archive coverage results
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "coverage-${{ matrix.subdir }}-${{ matrix.python-version }}"
          path: ${{ matrix.subdir }}/cover/
