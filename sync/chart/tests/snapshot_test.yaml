# To update manifest snapshots run helm unittest plugin with -u option:
# docker run -i --rm -v $(pwd):/apps helmunittest/helm-unittest -u /path/to/chart
suite: Manifest snapshot tests
values:
  - values_test_overrides.yaml
tests:
  - it: templated manifests should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: templated manifests should match snapshot with external auth enabled
    set:
      externalAuth.enabled: true
      externalAuth.url: http://auth.example.com/verify
      externalAuth.signinUrl: https://auth.example.com/login
    asserts:
      - matchSnapshot: {}
  - it: templated manifests should match snapshot with external auth error service
    set:
      externalAuth.enabled: true
      externalAuth.url: http://auth.example.com/verify
      externalAuth.errorService.name: my-auth-service
      externalAuth.errorService.port: 8080
    asserts:
      - matchSnapshot: {}
