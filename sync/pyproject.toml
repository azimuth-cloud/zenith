[project]
name = "zenith-sync"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.3",
    "click>=8.5.0",
    "configomatic[yaml]>=0.4.0",
    "easykube>=0.6.0",
    "easysemver>=0.2.0",
    "httpx>=0.28.1",
    "kube-custom-resource>=0.6.1",
    "pydantic<3",
    "pyhelm3>=0.5.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
zenith-sync = "zenith.sync.cli:main"

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "black~=26.5.1",
    "codespell>=2.4.3",
    "coverage!=4.4,>=7.15.0",
    "mypy>=2.3.1",
    "python-subunit>=1.4.6",
    "ruff~=0.15.20",
    "stestr>=4.2.1",
    "testtools>=2.9.1",
    "types-pyyaml>=6.0.12.20260906",
    "types-setuptools>=84.0.0.20260812",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1+unknown"

[tool.hatch.build.targets.sdist]
packages = ["zenith"]
[tool.hatch.build.targets.wheel]
packages = ["zenith"]
