[tool.uv.workspace]
members = [
    "client",
    "operator",
    "registrar",
    "sshd",
    "sync",
]

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "codespell",
    "diff-cover>=10.6.0",
    "mypy",
    "pytest>=9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff",
    "tox",
    "tox-uv",
    "types-pyyaml",
    "types-setuptools",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-builtins
    "A",
    # Ruff rules
    "RUF",
    # flake8-async
    "ASYNC",
    # pyupgrade
    "UP",
    # tidy imports
    "TID",
    # sorted imports
    "I",
    # check complexity
    "C90",
    # pep8 naming
    "N",
]
ignore = [
    "UP038", # deprecated
    "UP017", # remove and fix once 3.10 no longer tested in CI
    "C901",
    "RUF100",
]

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
# zenith is a namespace package, so map each component's files from its own root
explicit_package_bases = true

# The component code does not pass mypy yet, so only report errors in the tests
# Remove a component from this list once it passes
[[tool.mypy.overrides]]
module = [
    "zenith.client.*",
    "zenith.operator.*",
    "zenith.registrar.*",
    "zenith.sshd.*",
    "zenith.sync.*",
]
ignore_errors = true

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 15.
max-complexity = 15

[tool.codespell]
ignore-words = ".codespellignore"
skip = "uv.lock,.venv,.tox,.git,.ruff_cache,.pytest_cache"
