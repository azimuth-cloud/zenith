[tool.uv.workspace]
members = [
    "client",
    "operator",
    "registrar",
    "sshd",
    "sync",
]

[dependency-groups]
dev = [
    "autopep8",
    "black",
    "codespell",
    "coverage",
    "mypy",
    "python-subunit",
    "ruff",
    "stestr",
    "testtools",
    "tox",
    "tox-uv",
    "types-pyyaml",
    "types-setuptools",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-builtins
    "A",
    # Ruff rules
    "RUF",
    # flake8-async
    "ASYNC",
    # pyupgrade
    "UP",
    # tidy imports
    "TID",
    # sorted imports
    "I",
    # check complexity
    "C90",
    # pep8 naming
    "N",
]
ignore = [
    "UP038", # deprecated
    "UP017", # remove and fix once 3.10 no longer tested in CI
    "C901",
    "RUF100",
]

[tool.mypy]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true


[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 15.
max-complexity = 15
