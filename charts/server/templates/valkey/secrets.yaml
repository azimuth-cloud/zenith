{{- if .Values.valkey.enabled }}
{{- $usersSecretName := tpl .Values.valkey.auth.usersExistingSecret . }}
{{- $passwordKey := .Values.valkey.auth.aclUsers.default.passwordKey }}
{{- $password := .Values.valkey.password }}
{{- if not $password }}
{{- /* Reuse the existing password if there is one, so that it is stable across upgrades */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $usersSecretName }}
{{- if $existing }}
{{- $password = index $existing.data $passwordKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
# The password for the default Valkey user, used by Valkey itself
apiVersion: v1
kind: Secret
metadata:
  name: {{ $usersSecretName }}
  labels: {{ include "zenith.componentLabels" (list . "valkey") | nindent 4 }}
type: Opaque
data:
  {{ $passwordKey }}: {{ b64enc $password }}
---
# The password for Valkey in the target namespace, used by the OAuth2 proxy for each service
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zenith.valkey.passwordSecretName" . }}
  namespace: {{ .Values.common.kubernetes.targetNamespace }}
  labels: {{ include "zenith.componentLabels" (list . "valkey") | nindent 4 }}
type: Opaque
data:
  password: {{ b64enc $password }}
{{- end }}
